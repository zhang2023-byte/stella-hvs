module_id: hvs_contribution_quantities
rules:
- id: hvs.contrib.all_values_after_l1
  title: Collect all reported or adopted values
  text: |-
    For the assigned contribution, collect every explicitly object-attributed
    value in the structured vocabulary that the current paper reports or adopts
    in its analysis or comparison. Include current-paper results,
    recomputations, adopted prior values, cited comparison values, alternative
    conditional values, and explicitly superseded historical values. Do not
    limit extraction to values produced by this paper or to the preferred,
    final, easiest, or most-unbound value. Do not collect values for other
    objects mentioned only in background. Passing a sample-selection or
    quality-control criterion does not make that criterion an
    object-attributed reported value.
- id: hvs.contrib.structured_quantity_scope
  title: Use only the structured quantity vocabulary
  text: |-
    Use only quantity paths declared by the submission schema. Preserve
    scientifically material results outside that vocabulary concisely in
    contribution_summary, not as structured quantities.
- id: hvs.contrib.coordinate_and_frame_mapping
  title: Define frame and state boundaries
  text: |-
    Map observed_phase_space only to reported or adopted observer-centred values at
    a stated observational or catalogue epoch; a paper-reported propagation to
    another epoch is eligible. Distance is heliocentric; parallax is astrometric,
    including reported zero or negative values; proper-motion paths are equatorial
    components with the reported mu-alpha versus mu-alpha-star convention; and
    radial_velocity is heliocentric or barycentric, not LSR/GSR.

    Map Galactocentric quantities only to the current, integration-t=0, or stated
    reference-epoch state, including such values reported by an orbit workflow.
    galactocentric_radius is the three-dimensional spherical radius, not cylindrical
    R; if the meaning is unresolved, do not submit it. Exclude values at other orbit
    times or events.
- id: hvs.contrib.velocity_mapping
  title: Distinguish the structured velocity quantities
  text: |-
    Use tangential_velocity only for a current/reference-state heliocentric
    sky-plane speed magnitude, and galactic_rest_frame_velocity only for a
    current/reference-state three-dimensional total-speed magnitude in the Galactic
    or Galactocentric rest frame. Do not substitute components, one-dimensional
    LSR/GSR line-of-sight velocities, escape quantities, or velocities at other
    orbit times or events. Galactocentric tangential or cylindrical velocities are
    unstructured and belong in contribution_summary only when scientifically
    material.
- id: hvs.contrib.probability_mapping
  title: Map only Galactic boundness probabilities
  text: |-
    Use bound_probability and unbound_probability only for true Galactic bound
    or unbound probabilities reported by the paper. An explicitly Galactic
    escape probability maps to unbound_probability. Do not substitute origin
    probabilities, classification confidence, escape velocity, ratios,
    margins, or other statistics.
- id: hvs.contrib.group_level_values
  title: Limit group-level value propagation
  text: |-
    A value, limit, or condition stated for every member of a named group or
    table may apply to the assigned object only when the paper explicitly
    defines that scope and the object is individually identifiable as a member.
    The same group-level evidence may support each covered object. Do not
    propagate from statements about only some members, a bare heading or table,
    or membership alone.

    Selection, query, quality-control, or sample-entry thresholds are not
    object-attributed reported values merely because an object passed the
    workflow. Do not propagate such thresholds into structured quantities. A
    threshold remains eligible only when the paper separately reports or adopts
    it as a scientific object-level result, bound, or constraint for the object
    or explicitly defined group.
- id: hvs.contrib.grouped_multivalue
  title: Group values per quantity as an unordered multiset
  text: |-
    Use one unordered values group per quantity. Deduplicate identical scientific
    values with the same uncertainty, condition, preference, and provenance. Retain
    alternatives only when each independently satisfies the quantity definition, and
    record their stated assumptions in condition; condition cannot make an otherwise
    ineligible value eligible.
- id: hvs.contrib.uncertainty_limits
  title: Preserve uncertainty and limit semantics
  text: |-
    Use error for a symmetric uncertainty and lower_error with upper_error for
    an asymmetric uncertainty; never mix the two forms. Represent a one-sided
    bound with the corresponding limit_kind. Represent a closed range with
    range_lower and range_upper and no central value. Do not reinterpret
    uncertainty bounds around a measurement as a reported range.
- id: hvs.contrib.no_derivation
  title: Preserve reported numerical representations
  text: |-
    Preserve reported numeric content, precision, and unit; do not calculate, infer,
    round, convert, average, or combine values. Do not propagate values unless the
    paper reports the propagated result, convert between distance and parallax, or
    synthesize radii or velocity magnitudes. Preserve boundness probabilities in
    their reported fraction or percent form; do not infer boundness or create
    cross-quantity scenario joins.
- id: hvs.contrib.value_evidence
  title: Support every numeric component
  text: |-
    Give every populated numeric component exactly one direct evidence locator
    in the current paper that preserves its printed representation. Use context
    evidence for meaning, unit, frame, or condition, never as a substitute for
    direct evidence. Use the smallest exact locator and raw fragment required by
    the submission schema, separate discontinuous passages, and never cite
    another object's value or non-evidentiary source structure.
- id: hvs.contrib.source_authority
  title: Use manuscript text for scientific meaning
  text: |-
    Use the author manuscript for scientific meaning, definitions, captions,
    headers, notes, and conditions. Use converted ECSV only for exact table
    addressing and interpret it through its mapped manuscript source. If ECSV
    materially conflicts with the manuscript, use a manuscript-supported value
    with text evidence; otherwise do not submit the unresolved value. Never let
    converted ECSV override the paper.
- id: hvs.contrib.paper_preferred
  title: Record only the paper's explicit preference
  text: |-
    Set paper_preferred to true only when the paper explicitly marks a value as
    adopted, preferred, fiducial, final, recommended, current, or a replacement
    used in its analysis. Set it to false only when the paper explicitly marks
    the value as superseded, replaced, rejected, non-adopted, or alternative;
    otherwise use null. Never choose a preference yourself. Multiple true
    values are allowed when the paper explicitly prefers multiple conditional
    results.
- id: hvs.contrib.source_provenance
  title: Preserve value provenance without guessing
  text: |-
    Set source to this_paper, prior_work, or unclear only as supported by the
    current paper. Provenance is independent of preference, so an adopted
    prior-work value may be paper_preferred. Use source_note only for useful
    paper-visible source or citation detail; do not turn it into a matching key.
