id: literature_asset_archive
human_intents:
- archive paper assets
- download papers
- pull literature assets
required_inputs:
- months_or_arxiv_ids
optional_inputs:
- timeout
- dry_run
clarify_if_missing:
- months_or_arxiv_ids
- network_download_permission
agent_prompt_template: >-
  Run literature_asset_archive for TARGET=<months_or_arxiv_ids>. Archive public arXiv/ADS
  assets for selected data-related papers or explicit arXiv IDs. Write audit.json for every
  paper and report each failed asset fetch; do not silently proceed as if missing assets
  succeeded.
prerequisite_checks:
- Confirm target notes or arXiv IDs.
- Confirm public network download permission.
- Confirm ADS_API_TOKEN when ADS metadata is expected.
commands:
- conda run -n stella-env python scripts/pull_literature_assets.py --from <from> --to <to>
- conda run -n stella-env python scripts/pull_literature_assets.py --arxiv-id <ids>
outputs:
- literature/<arxiv_id>/audit.json
- literature/<arxiv_id>/arxiv_abs.html
- literature/<arxiv_id>/arxiv.pdf
- literature/<arxiv_id>/arxiv_source/
- literature/<arxiv_id>/ads_metadata.json
validators:
- Review literature/<arxiv_id>/audit.json for success and failure records.
risk_level: network_download
network_policy: Requires explicit permission for public HTTP(S) downloads and ADS API calls.
generated_files_policy: literature/ is generated archive data and ignored by Git by default.
referenced_paths:
- scripts/pull_literature_assets.py
- docs/data-contract.md
