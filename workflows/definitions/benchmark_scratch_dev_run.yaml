id: benchmark_scratch_dev_run
human_intents:
- run scratch dev10 in the terminal
- preflight scratch HVS extraction
- evaluate a scratch dev run
- run one explicit scratch test smoke
required_inputs:
- run_id
- scope (full_dev|targeted_dev|test_smoke)
optional_inputs:
- arxiv_id (targeted_dev, or exactly one for test_smoke)
- variant (default single; ensemble is historical only)
- paper_workers (default 2)
- candidate_workers (default 4)
- roster_only (default false; historical experiment only)
- log_path (default benchmark/scratch/hvs-extraction/logs/<run_id>.log)
clarify_if_missing:
- run_id
- explicit real API/LLM authority before a non-preflight run
- explicit private-gold evaluation authority before evaluation
agent_prompt_template: >-
  Run benchmark_scratch_dev_run as a terminal-only scratch workflow against
  the active hvs-extraction-v4 manifest. Do not open, modify, or reuse the
  benchmark Dev Console. Resolve full_dev to the complete dev10 in manifest
  order; resolve targeted_dev only to declared dev papers. Reject test papers
  by default. Permit test_smoke only with --allow-test-smoke and exactly one
  explicit test paper; label it test_smoke and never score it. Run
  --preflight-only first: it must create no Run and make no API call. A real
  run requires explicit API/LLM authority, a clean tracked worktree, no
  untracked execution files under src/, scripts/, skills/, or workflows/,
  frozen GLM-5.2-thinking single-roster plus DeepSeek-V4-Pro field routes, and
  a new safe Run ID. Each field candidate shares one maximum of three
  physical provider requests across the initial call, transport retries,
  format correction, and evidence correction. Never resume, selectively
  rerun, or overwrite a Run; after interruption, failure, or code change use
  a new Run ID and preserve the old artifacts. Stream redacted progress to
  stdout and an ignored tee log without paper context, model replies, gold,
  credentials, or hidden reasoning. Evaluation is a separate explicit
  command: read papers only from v2 run_config, reject test_smoke, keep
  aggregate scorecards in ignored scratch storage, and write item-level
  scoring details only outside the workspace beside STELLA_GOLD_DIR. Report
  delivery, L1, L2, per-field coverage, repairs, calls, tokens, and time
  separately; produce no composite score or automatic pass/fail.
prerequisite_checks:
- Confirm generated extraction-rule views and schema version references are current.
- Confirm the active hvs-extraction-v4 manifest is readable and the requested papers preserve manifest order.
- Confirm the Run ID is a safe unused path segment and neither its directory nor persistent lock exists.
- Confirm tracked files are clean; block untracked execution files under src/, scripts/, skills/, and workflows/, while reporting unrelated root exports only as warnings.
- Confirm every selected literature source passes deterministic preparation without creating Run artifacts.
- Confirm configured LLM credentials and explicit real API authority before omitting --preflight-only.
- Before evaluation, require an external STELLA_GOLD_DIR and explicit scoring authority; test_smoke is never eligible.
commands:
- >-
  conda run --no-capture-output -n stella-env python -u
  scripts/run_hvs_extraction_scratch.py --run-id <run_id> --dev
  --variant single --paper-workers 2 --candidate-workers 4 --preflight-only
- >-
  caffeinate -dimsu conda run --no-capture-output -n stella-env python -u
  scripts/run_hvs_extraction_scratch.py --run-id <run_id> --dev
  --variant single --paper-workers 2 --candidate-workers 4
- >-
  conda run --no-capture-output -n stella-env python -u
  scripts/evaluate_hvs_extraction_scratch.py --run-id <run_id>
outputs:
- benchmark/scratch/hvs-extraction/runs/<run_id>/run_config.json
- benchmark/scratch/hvs-extraction/runs/<run_id>/prepared_inputs/
- benchmark/scratch/hvs-extraction/runs/<run_id>/papers/<arxiv_id>/
- benchmark/scratch/hvs-extraction/runs/<run_id>/run_summary.json
- benchmark/scratch/hvs-extraction/runs/<run_id>/evaluation/scorecard.json (only after explicit dev evaluation)
- benchmark/scratch/hvs-extraction/runs/<run_id>/evaluation/evaluation.json (only after explicit dev evaluation)
- benchmark/scratch/hvs-extraction/logs/<run_id>.log
- $STELLA_GOLD_DIR/../scoring-details/scratch/<run_id>/details.json (private)
validators:
- The v2 run config records scope, active-manifest path/hash and ordered papers, execution settings, the shared three-request field policy, method and run fingerprints, code revision, and worktree check.
- Run creation validates the path segment, creates a persistent exclusive lock and new directory atomically, and refuses every existing Run ID without changing old files.
- The v2 run summary is built only from run_config papers and reports complete, partial, failed, missing, delivery rate, physical calls, tokens, and elapsed time.
- One paper worker exception persists harness_failure without preventing peer papers or the final summary; Ctrl-C persists an interrupted summary and returns 130.
- Terminal lines flush immediately and include stage, candidate, attempt, retry or correction type, duration, usage, and terminal status without source text, model output, secrets, gold, or hidden reasoning.
- Evaluation requires consistent v2 config, summary, and paper artifacts; refuses test_smoke and writes private item details only outside the public workspace.
- The terminal evaluation displays delivery, L1 precision/recall/F1, L2 strict and lenient agreement, coverage and fill precision, per-field coverage including bound probability when present, repairs, truncation salvage, physical requests, tokens, and elapsed time without a synthetic overall verdict.
risk_level: terminal_network_llm_private_gold
network_policy: >-
  --preflight-only makes no provider request and creates no Run. A non-preflight
  runner command requires explicit authority for the configured real LLM calls
  and authorizes only the papers frozen in the new run_config. Evaluation is a
  separate local action requiring explicit private-gold authority. Public
  downloads, ADS calls, fallback models, and every other external action remain
  out of scope.
generated_files_policy: >-
  All scratch Runs and tee logs are ignored local evidence. Never commit them,
  copy private gold into them, overwrite or resume them, or combine results from
  selective reruns. Aggregate evaluation is ignored; item-level scoring details
  remain in the external private repository. Existing 2406.14134 smoke artifacts
  and local fixtures remain untouched.
referenced_paths:
- benchmark/AGENTS.md
- benchmark/hvs_extraction_scratch_decisions.yaml
- scripts/run_hvs_extraction_scratch.py
- scripts/evaluate_hvs_extraction_scratch.py
- src/stella/benchmark/scratch/run.py
- src/stella/benchmark/scratch/run_policy.py
- src/stella/benchmark/scratch/evaluate.py
- src/stella/schema_registry.py
- skills/hvs-candidates-extraction/rules/hvs-field-scratch.yaml
- workflows/definitions/benchmark_extraction_run.yaml
- benchmark/campaigns/hvs-extraction-v4/manifest/campaign_manifest.json
