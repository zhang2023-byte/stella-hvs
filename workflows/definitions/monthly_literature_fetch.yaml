id: monthly_literature_fetch
human_intents:
- fetch HVS literature
- update monthly papers
- process recent HVS papers
required_inputs:
- from
optional_inputs:
- to
- source
- llm_review
- max_results
- categories
clarify_if_missing:
- from
- network_permission_for_new_fetches
- llm_review_when_requested_but_unspecified
agent_prompt_template: >-
  Run monthly_literature_fetch for FROM=<from> and optional TO=<to>. Use source=deepxiv,
  llm_review=False, max_results=20, categories=astro-ph.GA,astro-ph.SR,astro-ph.IM unless
  the user overrides them. Do not make real DeepXiv calls unless the user explicitly allows
  new data fetching. Preserve provenance, write monthly JSON/Markdown, and report quota/API
  partial results with resume guidance.
prerequisite_checks:
- Confirm environment stella-env is available if executing.
- Confirm the user allowed real network/API fetching.
- Confirm .env has DEEPXIV_TOKEN when source=deepxiv.
commands:
- conda run -n stella-env python scripts/fetch_literature.py --from <from>
outputs:
- notes/YYYY/YYYY-MM/YYYY-MM.json
- notes/YYYY/YYYY-MM/YYYY-MM.md
- notes/YYYY/YYYY-MM/YYYY-MM.title-triage.json
- notes/00_literature_notes_index.json
- notes/00_literature_notes_index.md
validators:
- conda run -n stella-env python scripts/render_literature_notes.py --index-only
risk_level: network
network_policy: Requires explicit permission for real new DeepXiv/arXiv fetching.
generated_files_policy: Do not manually edit generated Markdown or force-add notes outputs.
referenced_paths:
- scripts/fetch_literature.py
- scripts/render_literature_notes.py
- skills/deepxiv-cli/SKILL.md
- docs/usage.md
- docs/title-triage.md
