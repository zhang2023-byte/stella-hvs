id: benchmark_run_finalize
human_intents:
- verify immutable benchmark run
- finalize benchmark run
- release benchmark test run
required_inputs:
- run_id
optional_inputs:
- create_test_release
clarify_if_missing:
- run_id
- explicit approval to create a future test release
agent_prompt_template: >-
  Verify the already finalized V6 RUN_ID=<run_id>. The canonical extractor and
  coding-agent harness write run_summary and run_manifest as part of their
  terminal state; this workflow verifies hashes and ordered L1/L2 coverage but
  never repairs or reseals an archive. A test release requires test_ready=true
  and an immutable full_test run. Never modify V1-V4 or the legacy
  experiment archive.
prerequisite_checks:
- Confirm the run belongs to hvs-extraction-v6.
- Confirm config, summary, and manifest exist and the run is no longer active.
- Reject create_test_release unless campaign test_ready=true and scope=full_test.
commands:
- >-
  conda run -n stella-env python scripts/seal_benchmark_run.py
  benchmark/campaigns/hvs-extraction-v6/runs/<run_id>
outputs:
- A verification result; no rewritten run artifacts.
validators:
- Confirm config papers and both manifest delivery layers have identical ordered coverage.
- Recompute every recorded artifact hash.
risk_level: local_integrity
network_policy: No network, model, or gold access.
generated_files_policy: Immutable run files are never overwritten.
referenced_paths:
- benchmark/AGENTS.md
- src/stella/benchmark/run_contract.py
- scripts/seal_benchmark_run.py
- src/stella/benchmark/test_release.py
