id: hvs_dynamics_calculate
human_intents:
- calculate HVS dynamics
- recompute unbound probabilities
- calculate total velocity and escape probability
- run Bayes kinematics
required_inputs:
- catalog_dir
optional_inputs:
- object_id
- samples
- seed
- dry_run
- write
- refresh_external
clarify_if_missing:
- network_api_permission_when_refresh_external
agent_prompt_template: >-
  Use hvs_dynamics_calculate with CATALOG_DIR=<catalog_dir default catalog>. Reuse official
  Gaia DR3 raw rows cached under external_enrichment by default, apply gaiadr3-zeropoint
  parallax correction, use literature RV when available, and otherwise ignore SIMBAD RV
  and use the Boubert-style missing-RV lower-limit convention. Then calculate Galactocentric
  total velocity and unbound probability with the same MCMC sample set. Write results into
  each object JSON dynamics field only when WRITE=True; use --dry-run True for review. Query
  Gaia DR3 only when refresh_external is explicitly requested.
prerequisite_checks:
- Confirm catalog/candidates exists.
- >-
  Confirm object JSON files contain external_enrichment.providers.gaia_dr3.raw_columns from
  a prior enriched merge, or use --refresh-external with explicit network permission.
- Confirm gaiadr3-zeropoint, galpy, emcee, and scipy are installed in stella-env.
- Read hvs_dynamics_calculate skill.
commands:
- >-
  conda run -n stella-env python scripts/calculate_hvs_dynamics.py --catalog-dir catalog
  --samples 10000 --write True
outputs:
- catalog/candidates/<object_id>.json dynamics field
validators:
- >-
  Inspect CLI JSON summary for skipped reasons, graveyard count, lower-limit count, and
  dynamics warnings.
- Run conda run -n stella-env python -m unittest discover tests after code changes.
risk_level: generated_data
network_policy: >-
  Default mode performs no network calls and uses external_enrichment Gaia DR3 cache only.
  --refresh-external / external-cache-mode=refresh queries public Gaia DR3 TAP through astroquery
  and requires explicit permission. The workflow must not call SIMBAD, DeepXiv, ADS, LLMs,
  or download literature assets.
generated_files_policy: >-
  catalog/ is generated; rerunning object_catalog_merge rebuilds object JSON and removes
  computed dynamics, so rerun hvs_dynamics_calculate after merge.
referenced_paths:
- scripts/calculate_hvs_dynamics.py
- skills/hvs-dynamics-calculate/SKILL.md
- docs/data-contract.md
