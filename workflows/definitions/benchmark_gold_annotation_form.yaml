id: benchmark_gold_annotation_form
human_intents:
- annotate benchmark gold
- fill expert annotation form
- serve gold annotation form
- expert-led gold annotation
- scribe my gold annotation
- transcribe candidates into the gold draft
- fill the annotation draft from the PDF
- act as annotation scribe
required_inputs:
- arxiv_id
- annotator
optional_inputs:
- port
- manifest
- gold_dir
- scribe_instructions (which objects are candidates, where the data lives)
- existing_draft_or_annotation_to_amend
clarify_if_missing:
- arxiv_id
- annotator
- scribe_instructions when the request asks for scribe transcription
- any_open_judgment when the request asks for scribe transcription
agent_prompt_template: >-
  Run benchmark_gold_annotation_form for ARXIV_ID=<arxiv_id> and
  ANNOTATOR=<annotator>. Follow the expert-led annotation protocol in
  benchmark/GUIDELINE.md: the expert judges from the PDF first, then may use
  the optional PDF-only scribe stage to transcribe expert-identified
  candidates and values into
  $STELLA_GOLD_DIR/<arxiv_id>/draft_<annotator>.json. In scribe mode, use a
  fresh single-paper session, read only literature/<arxiv_id>/arxiv.pdf,
  benchmark/GUIDELINE.md, benchmark/templates/, and this paper's own files
  under $STELLA_GOLD_DIR/<arxiv_id>/; do not add, remove, or reinterpret
  candidates; stop and ask on any open judgment; do not run
  upgrade_gold_annotation.py or write final annotation JSON. For expert
  transcription, treat extracted PDF text only as a search aid. Before
  attributing text or values to an object, section, table row, or column,
  inspect the rendered PDF page or crop. This visual check is mandatory for
  multi-column layouts, adjacent identifiers, tables, footnotes, and
  cross-page content. If extracted reading order conflicts with the visible
  layout, follow the rendered PDF and report the discrepancy. For expert
  verification and final save, serve the local-only expert form on 127.0.0.1,
  allow optional unvalidated draft checkpoints, write
  $STELLA_GOLD_DIR/<arxiv_id>/annotation_<annotator>.yaml in the external
  private gold repository, and generate the JSON twin (with its leak-audit
  canary) through the gold schema. Do not show AI outputs, TeX, ECSV, archived
  runs, scorecards, or report pages; the PDF is the only evidence source.
  Treat $STELLA_GOLD_DIR as the single canonical private gold store; campaigns
  never own duplicate private annotation trees. After final saves, a separate
  gold-authorized task may refresh the hvs-extraction-v6 campaign's hash-only
  gold_manifest.json after explicit V6 snapshot authorization.
prerequisite_checks:
- Read benchmark/GUIDELINE.md and benchmark/README.md for the expert-led
  scribe protocol and evidence rules.
- Confirm STELLA_GOLD_DIR points at the external private gold repository's
  gold/ directory (or pass --gold-dir).
- Confirm literature/<arxiv_id>/arxiv.pdf exists for the expert to read separately.
- Confirm the annotator handle is the intended stable short handle.
- For scribe transcription, confirm the expert has already made the Section 2
  step 1 judgments and supplied the candidate list plus supporting tables or
  sections.
- For scribe transcription, confirm the session is fresh for this paper and
  will be retired after the draft is delivered.
commands:
- >-
  conda run -n stella-env python scripts/serve_gold_annotation.py --arxiv-id
  <arxiv_id> --annotator <annotator>
- conda run -n stella-env python scripts/update_gold_manifest.py
outputs:
- $STELLA_GOLD_DIR/<arxiv_id>/draft_<annotator>.json (optional unvalidated checkpoint)
- $STELLA_GOLD_DIR/<arxiv_id>/annotation_<annotator>.yaml
- $STELLA_GOLD_DIR/<arxiv_id>/annotation_<annotator>.json
- benchmark/campaigns/hvs-extraction-v6/manifest/gold_manifest.json (hash-only; separate gold-authorized snapshot task)
validators:
- >-
  Before saving a scribe draft, visually re-check every object-level
  attribution and table mapping against the rendered PDF page, including the
  section heading or row and column labels. Do not validate attribution from
  extracted text order alone.
- >-
  Expert loads any scribe-prepared draft in scripts/serve_gold_annotation.py
  and verifies every value, unit, and evidence locator against the PDF before
  validating and saving final gold.
- >-
  conda run -n stella-env python scripts/upgrade_gold_annotation.py
  $STELLA_GOLD_DIR/<arxiv_id>/annotation_<annotator>.yaml
risk_level: human_gold_annotation
network_policy: Local form only; no network access, API calls, downloads, or LLM calls.
generated_files_policy: >-
  Draft JSON is an unvalidated checkpoint only. Final YAML is the
  expert-verified source; final JSON is generated from the same validated
  payload with a deterministic canary. Both live in the external private
  gold repository and must never be copied into this workspace. Do not
  hand-edit final JSON and do not use this form to inspect AI outputs. A
  scribe-prepared draft is part of the expert annotation workflow, but the
  scribe session context carries gold content: retire it after delivery and
  never reuse it for extraction runs, scoring, report building, or toolchain
  development.
referenced_paths:
- benchmark/AGENTS.md
- scripts/serve_gold_annotation.py
- src/stella/benchmark/gold_form.py
- scripts/upgrade_gold_annotation.py
- scripts/update_gold_manifest.py
- benchmark/GUIDELINE.md
- benchmark/README.md
- benchmark/templates/gold_annotation_template.yaml
- benchmark/templates/gold_annotation_example.yaml
