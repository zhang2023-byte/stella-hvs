id: hvs_catalog_web_build
human_intents:
- build HTML catalog
- refresh website
- build demo site
required_inputs:
- catalog_dir
optional_inputs:
- web_dir
clarify_if_missing:
- deployment_target_if_user_says_deploy_or_publish
agent_prompt_template: >-
  Run hvs_catalog_web_build using CATALOG_DIR=<catalog_dir default catalog> and WEB_DIR=<web_dir
  default catalog/web>. Build live and static pages from generated object-level catalog
  JSON. Do not treat HTML as source of truth. Verify expected catalog/web/live and catalog/web/static
  outputs exist.
prerequisite_checks:
- Confirm catalog/03_hvs_candidates_index.json exists.
- Confirm this is a local HTML build, not deployment.
commands:
- >-
  conda run -n stella-env python scripts/build_hvs_catalog_web.py --catalog-dir catalog
  --web-dir catalog/web
outputs:
- catalog/web/live/index.html
- catalog/web/live/assets/
- catalog/web/static/index.html
validators:
- Confirm catalog/web/live/index.html and catalog/web/static/index.html exist after build.
risk_level: generated_view
network_policy: No network access required for local build.
generated_files_policy: catalog/web/ is a display layer generated from catalog/.
referenced_paths:
- scripts/build_hvs_catalog_web.py
- docs/data-contract.md
