id: hvs_catalog_pages_prepare
human_intents:
- prepare GitHub Pages site
- publish HTML catalog
- deploy website
- prepare website deployment
required_inputs:
- source_web_dir
optional_inputs:
- pages_dir
clarify_if_missing:
- deployment_target_if_not_github_pages
agent_prompt_template: >-
  Run hvs_catalog_pages_prepare using SOURCE_WEB_DIR=<source_web_dir default catalog/web/static>
  and PAGES_DIR=<pages_dir default pages>. First build the local static HTML snapshot if needed,
  then copy it into the committed GitHub Pages publish directory. Do not treat pages/ or
  catalog/web/ as source of truth.
prerequisite_checks:
- Confirm catalog/web/static/index.html exists or run hvs_catalog_web_build first.
- Confirm GitHub Pages is the deployment target.
- Confirm pages/ is intended to be committed as a deployment snapshot.
commands:
- >-
  conda run -n stella-env python scripts/build_hvs_catalog_web.py --catalog-dir catalog
  --web-dir catalog/web
- python scripts/prepare_pages_site.py --source catalog/web/static --pages-dir pages
outputs:
- pages/index.html
- pages/catalog-data.js
- pages/catalog-viewer.js
- pages/stella.css
- pages/stella-hvs-hero.png
- pages/.nojekyll
validators:
- Confirm pages/index.html and pages/catalog-data.js exist after preparation.
- >-
  Run conda run -n stella-env python -m unittest tests.test_hvs_catalog_site tests.test_workflow_manifest
  after code changes.
risk_level: generated_view_deployment_artifact
network_policy: Local preparation requires no network access. Git push triggers GitHub Pages
  deployment remotely.
generated_files_policy: >-
  pages/ is a committable deployment snapshot derived from catalog/web/static; catalog JSON
  remains the source of truth.
referenced_paths:
- scripts/prepare_pages_site.py
- .github/workflows/deploy-pages.yml
- docs/usage.md
- docs/outputs.md
