id: hvs_contribution_extraction_batch
human_intents:
- batch extract HVS contributions
- extract HVS contributions for multiple papers
required_inputs:
- arxiv_ids
optional_inputs:
- concurrency
clarify_if_missing:
- arxiv_ids
- explicit authority before real LLM calls
agent_prompt_template: >-
  Run the contribution-first extraction for multiple papers with
  ARXIV_IDS=<arxiv_ids>. Each fresh worker handles exactly one arxiv_id,
  reads and writes only its own paper scope, and is never reused for
  another paper; use adaptive concurrency and create fewer workers rather
  than sharing one scientific context across papers. Follow the single-paper
  hvs_contribution_extraction workflow inside each worker, including its
  preflight default and explicit real-call authority.
prerequisite_checks:
- Confirm every arxiv_id exists under literature/.
- Confirm the platform can create one fresh worker per paper.
commands:
- >-
  conda run -n stella-env python scripts/run_hvs_contribution_extraction.py
  --arxiv-id <one_arxiv_id> --preflight-only
outputs:
- runs/hvs-contribution-extraction/<run_id>/papers/<arxiv_id>/literature_hvs_contributions.json
validators:
- conda run -n stella-env python scripts/validate_hvs_contributions.py --run-paper-dir runs/hvs-contribution-extraction/<run_id>/papers/<arxiv_id>
risk_level: network_llm_generated_data
network_policy: Real model calls require explicit user authority; preflight and fake transport make none.
generated_files_policy: >-
  Batch contribution runs stay non-formal local artifacts under the ignored
  contribution run root; they are never benchmark results.
orchestration:
  unit: arxiv_id
  worker_workflow: hvs_contribution_extraction
  worker_reuse_policy: never
  concurrency_strategy: bounded_runner_or_adaptive_workers
referenced_paths:
- workflows/definitions/hvs_contribution_extraction.yaml
- scripts/run_hvs_contribution_extraction.py
- docs/data-contract.md
