id: hvs_contribution_catalog_merge
human_intents:
- merge HVS contribution catalog
- rebuild contribution timelines
- update contribution object catalog
required_inputs: []
optional_inputs:
- literature_dir
- output_dir
clarify_if_missing: []
agent_prompt_template: >-
  Rebuild the object-level HVS contribution timeline catalog from every
  literature/<arxiv_id>/literature_hvs_contributions.json document. The
  catalog preserves the complete chronological contribution timeline per
  object, keeps bound follow-up reassessments visible, never flattens
  grouped multivalues, never deduplicates scientifically distinct
  prior-work values across papers, and stores no authoritative global
  boundness state. Keep the V6 candidates catalog untouched.
prerequisite_checks:
- Confirm the contribution documents validate (scripts/validate_hvs_contributions.py).
commands:
- >-
  conda run -n stella-env python scripts/merge_hvs_contribution_catalog.py
  --output-dir catalog/contributions
outputs:
- catalog/contributions/<object_id>.json
- catalog/contributions/index.json
validators:
- conda run -n stella-env python scripts/build_hvs_contributions_index.py --literature-dir literature
risk_level: generated_data
network_policy: No network access.
generated_files_policy: >-
  catalog/contributions is a derived, ignored product rebuilt from the
  canonical contribution documents; never edit by hand.
referenced_paths:
- scripts/merge_hvs_contribution_catalog.py
- src/stella/lit/hvs_contribution_catalog.py
- docs/data-contract.md
