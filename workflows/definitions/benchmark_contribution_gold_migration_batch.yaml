id: benchmark_contribution_gold_migration_batch
human_intents:
- migrate the original 50 HVS gold papers to contribution gold
- batch create AI-assisted contribution gold
- coordinate contribution gold migration
required_inputs:
- arxiv_ids
- preannotation_model
- reconciliation_model
optional_inputs:
- expert_mapping
- work_dir
- gold_dir
- concurrency
clarify_if_missing:
- arxiv_ids
- expert_mapping when it cannot be derived from the frozen V6 selection profiles
- explicit authority before AI calls
- explicit authority to read and overwrite private gold
agent_prompt_template: >-
  Run benchmark_contribution_gold_migration_batch for ARXIV_IDS=<arxiv_ids>.
  Every id must belong to the original V6 50-paper sample; subsets are allowed
  for staged migration, but no new paper may enter this workflow. Dispatch one
  fresh paper worker per arxiv_id using benchmark_contribution_gold_migration
  and never reuse a scientific context across papers. Within each paper worker,
  the PDF-only preannotation context is isolated from the reconciliation and
  private-gold context. Use adaptive concurrency, but serialize expert review
  and final save as needed. Track preannotation, reconciliation, expert review,
  validation, final save, and temporary cleanup separately. A paper is complete
  only after explicit paper-level expert approval, validated YAML/JSON twins,
  and deletion of its known migration artifacts. Never update the V6 public
  gold manifest; these 50 papers are not a new unseen test set.
prerequisite_checks:
- Resolve arxiv_ids as a subset of the original V6 50-paper sampling manifest.
- Confirm the platform can create one fresh worker per paper without context reuse.
- Confirm the private gold repository has one clean pre-migration commit or tag before any overwrite.
- Resolve each legacy annotation through the frozen dev/test gold-selection profiles.
- Confirm explicit AI-call and private-gold read/write authority.
commands:
- Dispatch one fresh benchmark_contribution_gold_migration worker per <arxiv_id>.
- Review each worker status before marking the batch complete.
outputs:
- $STELLA_GOLD_DIR/<arxiv_id>/annotation_<annotator>.yaml
- $STELLA_GOLD_DIR/<arxiv_id>/annotation_<annotator>.json
- Batch status summary without scientific gold content
validators:
- Every requested id is in the original V6 50-paper sample.
- Every completed paper satisfies the single-paper workflow validators.
- Incomplete or expert-unapproved papers remain explicit and are not counted complete.
- No approved paper retains preannotation.json, conflict_report.json, or a migration draft.
- The V6 public gold_manifest.json remains byte-identical.
risk_level: network_llm_private_gold_write
network_policy: AI calls require explicit authority; no downloads or production extraction calls are permitted.
generated_files_policy: >-
  The parent retains only a value-free status summary. Per-paper migration work
  is temporary and deleted after approval; final gold remains only in the
  external private repository.
orchestration:
  unit: arxiv_id
  worker_workflow: benchmark_contribution_gold_migration
  worker_reuse_policy: never
  concurrency_strategy: adaptive_probe
  parent_role: dispatch_monitor_summarize
  worker_status_fields:
  - arxiv_id
  - preannotation_status
  - reconciliation_status
  - expert_review_status
  - validation_status
  - final_save_status
  - temporary_cleanup_status
  - blockers
referenced_paths:
- benchmark/AGENTS.md
- workflows/definitions/benchmark_contribution_gold_migration.yaml
- benchmark/campaigns/hvs-extraction-v6/manifest/sampling_manifest.json
- docs/data-contract.md
