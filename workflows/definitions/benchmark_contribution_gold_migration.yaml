id: benchmark_contribution_gold_migration
human_intents:
- migrate one existing HVS gold annotation to the contribution schema
- create AI-assisted contribution gold for one original benchmark paper
- review and approve one contribution gold draft
required_inputs:
- arxiv_id
- annotator
- preannotation_model
- reconciliation_model
optional_inputs:
- work_dir
- gold_dir
- legacy_gold_selection_profile
- preannotation_agent
- reconciliation_agent
clarify_if_missing:
- arxiv_id
- annotator
- explicit authority before AI calls
- explicit authority to read and overwrite the selected private gold annotation
- paper-level expert approval before final save
agent_prompt_template: >-
  Run benchmark_contribution_gold_migration for ARXIV_ID=<arxiv_id> and final
  expert ANNOTATOR=<annotator>. This workflow is restricted to papers in the
  original V6 50-paper sampling manifest and produces fresh contribution-first
  gold; it never mechanically maps V6 fields. First create one clean-context
  preannotation worker for this paper. That worker may read only the current
  paper PDF, benchmark/GUIDELINE.md, and the contribution blank template; it
  must not read legacy gold or notes, production hvs_contribution_extraction
  outputs, TeX/ECSV, runs, scorecards, or scoring details. It writes a complete
  PDF-located draft to <work_dir>/<arxiv_id>/preannotation.json. Then, in the
  paper's separate reconciliation context, compare that draft with the legacy
  annotation selected by the frozen V6 gold-selection profile. Treat legacy
  content only as a hint for omissions or conflicts, re-check uncertain points
  against the PDF, and write conflict_report.json plus draft_<annotator>.json;
  never import an unsupported legacy value. The expert reads the PDF and the
  complete reconciled draft, performs paper-level overall review, requests any
  corrections, and explicitly approves the paper. The expert is not required
  to extract from a blank form or certify every value and locator separately.
  Only after that approval, validate and atomically overwrite
  $STELLA_GOLD_DIR/<arxiv_id>/annotation_<annotator>.yaml/.json. The save records
  both AI stages and paper_level review in annotation_process and deletes the
  known temporary preannotation, conflict report, and draft files. Do not
  refresh the V6 gold manifest. A future contribution campaign creates its own
  hash-only manifest.
prerequisite_checks:
- Confirm arxiv_id belongs to the original V6 50-paper sampling manifest.
- Confirm literature/<arxiv_id>/arxiv.pdf exists.
- Confirm the private gold repository has a clean pre-migration commit or tag preserving V6 gold.
- Confirm STELLA_GOLD_DIR is the external private gold root and work_dir is a temporary external path.
- Resolve the legacy annotation only through the frozen V6 gold-selection profile; never choose by filename order.
- Confirm the clean preannotation context has no legacy gold or production-extractor access.
commands:
- >-
  conda run -n stella-env python scripts/serve_hvs_contribution_gold_annotation.py
  --arxiv-id <arxiv_id> --annotator <annotator> --work-dir <work_dir>
  --gold-dir <gold_dir> --allow-drafts --allow-final-save
- >-
  conda run -n stella-env python scripts/upgrade_hvs_contribution_gold_annotation.py
  <gold_dir>/<arxiv_id>/annotation_<annotator>.yaml
outputs:
- $STELLA_GOLD_DIR/<arxiv_id>/annotation_<annotator>.yaml
- $STELLA_GOLD_DIR/<arxiv_id>/annotation_<annotator>.json
validators:
- The final document validates as benchmark.hvs_contribution_annotation v1.
- annotation_process records both AI models and expert_review_scope paper_level.
- Every final scientific evidence locator addresses the current paper PDF; legacy notes are not evidence.
- No production extraction output, run, scorecard, or scoring detail was used as gold input.
- Known temporary files for an approved paper no longer exist under work_dir.
- The V6 public gold_manifest.json remains byte-identical.
risk_level: network_llm_private_gold_write
network_policy: >-
  AI calls require explicit authority. No downloads or production extraction
  calls are part of this workflow; the review form is local-only.
generated_files_policy: >-
  preannotation.json, conflict_report.json, and draft_<annotator>.json are
  temporary migration work and are deleted after expert-approved final save.
  Only the validated YAML/JSON twin remains in the external private gold repo.
  Historical V6 gold remains recoverable from the private repository's
  pre-migration commit or tag; never refresh the V6 public manifest.
referenced_paths:
- benchmark/AGENTS.md
- benchmark/GUIDELINE.md
- benchmark/README.md
- benchmark/templates/hvs_contribution_annotation_template.yaml
- workflows/definitions/benchmark_contribution_gold_migration.yaml
- scripts/serve_hvs_contribution_gold_annotation.py
- scripts/upgrade_hvs_contribution_gold_annotation.py
- src/stella/benchmark/hvs_contribution_gold.py
- src/stella/benchmark/hvs_contribution_gold_form.py
- docs/data-contract.md
- benchmark/campaigns/hvs-extraction-v6/manifest/sampling_manifest.json
- benchmark/campaigns/hvs-extraction-v6/manifest/gold_selections/evaluation-dev-primary-v1.json
- benchmark/campaigns/hvs-extraction-v6/manifest/gold_selections/evaluation-test-primary-v1.json
