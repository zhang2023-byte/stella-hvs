id: benchmark_campaign_prepare
human_intents:
- prepare benchmark campaign
- rebuild hvs extraction campaign
- freeze benchmark sample
required_inputs: []
optional_inputs:
- sampling_manifest
- campaign_manifest
clarify_if_missing: []
agent_prompt_template: >-
  Run benchmark_campaign_prepare for hvs-extraction-v4. Reuse the committed
  hvs-extraction-v3 sampling manifest byte-for-byte without resampling, then
  build the V4 campaign manifest. Confirm the
  result is exactly 50 papers, with the fixed 10-paper proxy-balanced dev
  split and exact 40-paper test complement. Do not read STELLA_GOLD_DIR or
  use gold/model outcomes to choose a split. Treat generated manifests as
  source-controlled contracts: inspect their byte-level determinism rather
  than hand-editing them.
prerequisite_checks:
- Confirm the committed hvs-extraction-v3 public sampling manifest is available locally.
- Confirm the active campaign is hvs-extraction-v4; v1, v2, and v3 are read-only history.
- Confirm this no-gold setup does not create hvs-extraction-v4/manifest/gold_manifest.json.
commands:
- >-
  conda run -n stella-env python scripts/build_benchmark_manifest.py
  --reuse-manifest benchmark/campaigns/hvs-extraction-v3/manifest/sampling_manifest.json
- conda run -n stella-env python scripts/build_benchmark_campaign.py
outputs:
- benchmark/campaigns/hvs-extraction-v4/manifest/sampling_manifest.json
- benchmark/campaigns/hvs-extraction-v4/manifest/campaign_manifest.json
validators:
- >-
  Rebuild both manifests in a temporary location and byte-compare them with
  the committed copies; verify V3/V4 paper ids, order, and split are identical,
  with 50 total, 10 dev, 40 test, and the four fixed post-stratified test weights.
risk_level: generated_data
network_policy: No API, LLM, or new download calls; version consistency uses local archived metadata.
generated_files_policy: >-
  Sampling and campaign manifests are deterministic generated contracts. Do
  not edit their JSON by hand; change the builder and tests, then regenerate.
referenced_paths:
- benchmark/AGENTS.md
- benchmark/README.md
- scripts/build_benchmark_manifest.py
- scripts/build_benchmark_campaign.py
- src/stella/benchmark/sampling.py
- src/stella/benchmark/campaign.py
- benchmark/campaigns/hvs-extraction-v3/manifest/sampling_manifest.json
- benchmark/campaigns/hvs-extraction-v4/manifest/campaign_manifest.json
