id: object_catalog_merge
human_intents:
- merge HVS catalog
- rebuild object catalog
- update catalog
required_inputs:
- mode
optional_inputs:
- arxiv_id
- path
- dry_run
- enrichment_mode
- external_merge_mode
clarify_if_missing:
- mode
- arxiv_id_or_path_when_mode_update
agent_prompt_template: >-
  Use hvs-candidates-merge with MODE=<rebuild|update>. For rebuild, merge all valid literature_hvs_candidates.json
  files into catalog/. For update, merge only ARXIV_ID=<arxiv_id> or PATH=<path>. Validate
  inputs first, preserve merge evidence and warnings, run default SIMBAD/Gaia DR3 enrichment
  plus external-assisted merge unless ENRICHMENT_MODE=off or EXTERNAL_MERGE_MODE=off, and
  do not manually edit generated catalog files.
prerequisite_checks:
- Confirm paper-level candidate files exist.
- Read hvs-candidates-merge skill and review principles.
- >-
  Confirm astroquery is installed for default enrichment/external merge or use --enrichment-mode
  off --external-merge-mode off.
- Use dry-run if the requested scope is ambiguous.
commands:
- >-
  conda run -n stella-env python scripts/merge_hvs_candidate_catalog.py rebuild --literature-dir
  literature --catalog-dir catalog --enrichment-mode auto --external-merge-mode auto --fail-on-skipped
- >-
  conda run -n stella-env python scripts/merge_hvs_candidate_catalog.py update --arxiv-id
  <arxiv_id> --literature-dir literature --catalog-dir catalog --enrichment-mode auto --external-merge-mode
  auto --fail-on-skipped
outputs:
- catalog/candidates/<object_id>.json
- catalog/03_hvs_candidates_index.json
- catalog/03_hvs_candidates_index.md
validators:
- >-
  Inspect catalog/03_hvs_candidates_index.md merge warnings, potential merges, enrichment
  warnings, and skipped inputs.
- Use --fail-on-skipped for rebuild/update runs that should fail on malformed inputs.
- Use --external-merge-mode review when external evidence should be audited without changing
  grouping.
- Use --enrichment-mode required when enrichment failures must fail the command.
risk_level: network_api_generated_data
network_policy: >-
  Default --enrichment-mode auto and --external-merge-mode auto make public SIMBAD and Gaia
  DR3 TAP queries through astroquery and may use official identity evidence for grouping;
  use --enrichment-mode off --external-merge-mode off for a pure offline old-style merge.
  Auto mode preserves offline outputs and records warnings if enrichment fails.
generated_files_policy: >-
  catalog/ is generated from paper-level JSON; fix source JSON and rerun merge if warnings
  reveal errors.
referenced_paths:
- scripts/merge_hvs_candidate_catalog.py
- skills/hvs-candidates-merge/SKILL.md
- docs/data-contract.md
