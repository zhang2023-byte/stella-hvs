id: catalog_review
human_intents:
- review paper data assets
- inspect catalog tables
- fill catalog_review
required_inputs:
- arxiv_id
optional_inputs:
- require_complete
clarify_if_missing:
- arxiv_id
- continue_if_archive_assets_missing
agent_prompt_template: >-
  Use hvs-catalog-review for one ARXIV_ID=<arxiv_id>. If the target contains multiple papers,
  route to catalog_review_batch instead. Inspect audit.json and archived source assets first.
  Generate the schema-backed catalog_review.json template if needed. Inventory internal
  LaTeX tables and paper-described external resources only. Do not decide HVS relevance
  and do not download external resources. In worker mode, read and write only this paper's
  directory and return the worker status contract. Validate with --require-complete and
  rebuild the catalog workflow index only when not running under a batch parent.
prerequisite_checks:
- Read literature/<arxiv_id>/audit.json.
- Confirm arXiv source/PDF/ADS metadata status.
- Read hvs-catalog-review skill and schema reference.
commands:
- conda run -n stella-env python scripts/init_catalog_review.py --arxiv-id <arxiv_id>
- >-
  conda run -n stella-env python scripts/validate_catalog_review.py --arxiv-id <arxiv_id>
  --require-complete
- conda run -n stella-env python scripts/build_catalog_index.py
outputs:
- literature/<arxiv_id>/catalog_review.json
- literature/01_literature_catalog_index.json
- literature/01_literature_catalog_index.md
validators:
- >-
  conda run -n stella-env python scripts/validate_catalog_review.py --arxiv-id <arxiv_id>
  --require-complete
risk_level: generated_data
network_policy: No new external resource downloads in this workflow.
generated_files_policy: catalog_review.json is paper-level source data; generated indexes
  must be rebuilt, not hand-edited.
referenced_paths:
- scripts/init_catalog_review.py
- scripts/validate_catalog_review.py
- scripts/build_catalog_index.py
- skills/hvs-catalog-review/SKILL.md
- docs/outputs.md
