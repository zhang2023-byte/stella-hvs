id: hvs_candidate_extraction
human_intents:
- extract HVS candidates
- run the canonical HVS extraction workflow
- fill literature_hvs_candidates
required_inputs:
- run_id
- scope (dev|targeted_dev|test_smoke|preflight)
optional_inputs:
- arxiv_id
- roster_provider
- roster_model
- core_field_provider
- core_field_model
- paper_workers
- candidate_workers
clarify_if_missing:
- run_id
- arxiv_id for targeted_dev or test_smoke
- explicit authority before real LLM calls
agent_prompt_template: >-
  Run the canonical hvs_candidate_extraction workflow with RUN_ID=<run_id> and
  SCOPE=<scope>. Use the V5 campaign and the staged roster then core-field
  engine. Keep roster and core-field model roles explicit in the frozen method
  fingerprint. Use --dev for the complete dev10, --arxiv-id for targeted dev,
  --preflight-only for a no-write/no-API check, and --allow-test-smoke only for
  one explicit test paper. Do not run the sealed 40-paper test. Every new run
  is immutable, every candidate shares a three-request field budget, and a
  roster-success/field-failure paper remains L1-deliverable and L2-partial.
  Produce v3 core artifacts only; supplements are separate experiments.
prerequisite_checks:
- Confirm the V5 campaign is active and test_ready=false.
- Confirm generated rule and schema views are current.
- Confirm the worktree passes the runner preflight.
- Confirm real LLM authority unless --preflight-only or a fake transport is used.
commands:
- >-
  conda run -n stella-env python -u scripts/run_hvs_candidate_extraction.py
  --run-id <run_id> --dev --preflight-only
- >-
  conda run -n stella-env python -u scripts/run_hvs_candidate_extraction.py
  --run-id <run_id> --dev --roster-provider <roster_provider>
  --roster-model <roster_model> --core-field-provider <core_field_provider>
  --core-field-model <core_field_model>
outputs:
- benchmark/campaigns/hvs-extraction-v5/runs/<run_id>/run_config.json
- benchmark/campaigns/hvs-extraction-v5/runs/<run_id>/papers/<arxiv_id>/paper_result.json
- benchmark/campaigns/hvs-extraction-v5/runs/<run_id>/papers/<arxiv_id>/literature_hvs_candidates.json
- benchmark/campaigns/hvs-extraction-v5/runs/<run_id>/run_summary.json
- benchmark/campaigns/hvs-extraction-v5/runs/<run_id>/run_manifest.json
validators:
- conda run -n stella-env python scripts/generate_extraction_rule_views.py --check
- conda run -n stella-env python scripts/generate_schema_docs.py --check
risk_level: network_llm_generated_data
network_policy: Real model calls require explicit user authority; fake transport and preflight do not.
generated_files_policy: >-
  V5 runs are ignored immutable run archives. Never resume, overwrite, or merge
  selective reruns into an existing run.
referenced_paths:
- scripts/run_hvs_candidate_extraction.py
- src/stella/hvs_extraction/run.py
- src/stella/hvs_extraction/method_config.py
- skills/hvs-candidates-extraction/SKILL.md
- skills/hvs-candidates-extraction/rules/profiles.yaml
- skills/hvs-candidates-extraction/rules/hvs-roster.yaml
- skills/hvs-candidates-extraction/rules/hvs-core-fields.yaml
- benchmark/SCORE_SPEC.md
- docs/data-contract.md
