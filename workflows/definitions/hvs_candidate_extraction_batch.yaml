id: hvs_candidate_extraction_batch
human_intents:
- batch extract HVS candidates
- extract HVS candidates for multiple papers
required_inputs:
- run_id
- arxiv_ids
optional_inputs:
- max_parallel
clarify_if_missing:
- run_id
- arxiv_ids
- explicit authority before real LLM calls
agent_prompt_template: >-
  Run one immutable canonical extraction run for RUN_ID=<run_id> and
  ARXIV_IDS=<arxiv_ids>. The benchmark runner provides per-paper failure
  isolation and bounded concurrency. For ad-hoc literature writes outside a
  campaign run, dispatch one fresh worker per paper and never mix scientific
  context across papers. Preserve input order in config, summary, and manifest.
prerequisite_checks:
- Resolve the exact paper list and confirm it does not contain a test paper unless this is one explicit test smoke.
- Confirm the canonical runner preflight passes.
commands:
- >-
  conda run -n stella-env python -u scripts/run_hvs_candidate_extraction.py
  --run-id <run_id> --arxiv-id <arxiv_id>
outputs:
- benchmark/campaigns/hvs-extraction-v6/runs/<run_id>/
validators:
- Confirm every configured paper has a complete, partial, failed, or missing terminal state.
risk_level: network_llm_generated_data
network_policy: Real model calls require explicit user authority.
generated_files_policy: Run archives are immutable and ignored.
orchestration:
  unit: arxiv_id
  worker_workflow: hvs_candidate_extraction
  worker_reuse_policy: never
  concurrency_strategy: bounded_runner_or_adaptive_workers
referenced_paths:
- scripts/run_hvs_candidate_extraction.py
- src/stella/hvs_extraction/run.py
- docs/data-contract.md
