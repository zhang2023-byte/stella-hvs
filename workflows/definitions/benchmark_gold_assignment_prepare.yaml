id: benchmark_gold_assignment_prepare
human_intents:
- assign benchmark gold papers to experts
- reserve gold annotation papers
- freeze gold annotation responsibilities
required_inputs:
- campaign
- assignment_id
- assignment_map
optional_inputs: []
clarify_if_missing:
- assignment_id
- the human-authorized primary and additional annotators for every campaign paper
agent_prompt_template: >-
  Build one public, value-free, write-once expert assignment profile for
  CAMPAIGN=<campaign> and ASSIGNMENT_ID=<assignment_id>. Preserve the exact
  campaign paper order. Each paper has exactly one primary annotator for the
  intended formal selection and zero or more distinct additional annotators
  for independent parallel annotation. Do not infer assignments from drafts,
  existing gold filenames, or annotation completion.
prerequisite_checks:
- Confirm the assignment map exactly covers the campaign.
- Confirm stable annotator handles contain no spaces.
- Confirm the assignment ID is new and will not overwrite a published profile.
commands:
- >-
  conda run -n stella-env python scripts/build_gold_assignment.py --campaign
  <campaign> --assignment-id <assignment_id> --assignment-map <assignment_map>
outputs:
- benchmark/campaigns/<campaign>/manifest/gold_assignments/<assignment_id>.json
validators:
- Verify paper order exactly matches the campaign manifest.
- Verify primary and additional annotators are distinct and use valid handles.
- Verify the public profile contains assignments only and no gold content.
risk_level: human_gold_assignment
network_policy: No network, model, or private-gold access.
generated_files_policy: Gold assignment profiles are public, immutable, and write-once.
referenced_paths:
- benchmark/AGENTS.md
- benchmark/GUIDELINE.md
- docs/data-contract.md
- scripts/build_gold_assignment.py
- src/stella/benchmark/gold_assignment.py
