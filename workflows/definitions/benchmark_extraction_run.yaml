id: benchmark_extraction_run
human_intents:
- run formal benchmark extraction
- run the V5 dev campaign
required_inputs:
- run_id
optional_inputs:
- arxiv_id
- preflight_only
- roster_model
- core_field_model
clarify_if_missing:
- run_id
- explicit authority before real LLM calls
agent_prompt_template: >-
  Run the canonical V5 HVS extraction for RUN_ID=<run_id>. Default to the
  complete dev10; use an arXiv id only for targeted dev. Run preflight before
  any real provider request. Formal test remains closed. Treat run_config,
  run_summary, run_manifest, paper_result, and v3 core artifacts as one
  immutable run contract.
prerequisite_checks:
- Confirm hvs-extraction-v5 is the active campaign and is not test-ready.
- Confirm the run id is new and the worktree passes preflight.
- Confirm explicit authority for real model calls.
commands:
- >-
  conda run -n stella-env python -u scripts/run_hvs_candidate_extraction.py
  --run-id <run_id> --dev --preflight-only
- >-
  conda run -n stella-env python -u scripts/run_hvs_candidate_extraction.py
  --run-id <run_id> --dev
outputs:
- benchmark/campaigns/hvs-extraction-v5/runs/<run_id>/
validators:
- Verify the V5 manifest exactly covers config papers in order at L1 and L2.
risk_level: network_llm_generated_data
network_policy: Real model calls require explicit user authority.
generated_files_policy: V5 run archives are immutable, local, and ignored.
referenced_paths:
- benchmark/AGENTS.md
- benchmark/benchmark_implementation.md
- scripts/run_hvs_candidate_extraction.py
- src/stella/hvs_extraction/run.py
- src/stella/benchmark/run_contract.py
