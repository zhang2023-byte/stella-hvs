id: benchmark_coding_agent_baseline
human_intents:
- run coding agent baseline
- compare coding agent with the canonical extractor
required_inputs:
- run_id
- adapter_command
- runtime
- runtime_version
- model
optional_inputs:
- arxiv_id
clarify_if_missing:
- run_id
- adapter_command
- runtime, runtime_version, and model identity
- explicit authority before the adapter invokes a model
agent_prompt_template: >-
  Run coding_agent_baseline for RUN_ID=<run_id> using an isolated one-paper
  bundle per paper. The baseline receives the same archived paper boundary,
  shared science rules, and v3 core output contract as the canonical workflow,
  but it must not reuse staged intermediate artifacts. Collect and validate
  outputs into the V5 immutable run contract so the same L1/L2 scorer can
  compare them.
prerequisite_checks:
- Confirm the adapter command and exact paper scope.
- Confirm the V5 campaign is active and formal test is closed.
- Confirm explicit authority if the adapter invokes a model.
commands:
- >-
  conda run -n stella-env python -u scripts/init_coding_agent_baseline.py
  --run-id <run_id> --runtime <runtime> --runtime-version <runtime_version>
  --model <model> --dev --preflight-only
- >-
  conda run -n stella-env python -u scripts/init_coding_agent_baseline.py
  --run-id <run_id> --runtime <runtime> --runtime-version <runtime_version>
  --model <model> --dev
- >-
  conda run -n stella-env python -u scripts/run_coding_agent_baseline.py
  prepare --run-dir benchmark/campaigns/hvs-extraction-v5/runs/<run_id>
  --arxiv-id <arxiv_id>
- >-
  conda run -n stella-env python -u scripts/run_coding_agent_baseline.py
  launch --bundle <bundle_path> -- <adapter_command>
- >-
  conda run -n stella-env python -u scripts/run_coding_agent_baseline.py
  collect --run-dir benchmark/campaigns/hvs-extraction-v5/runs/<run_id>
  --bundle <bundle_path>
- >-
  conda run -n stella-env python -u scripts/run_coding_agent_baseline.py
  finalize --run-dir benchmark/campaigns/hvs-extraction-v5/runs/<run_id>
outputs:
- benchmark/campaigns/hvs-extraction-v5/runs/<run_id>/
validators:
- Verify every collected artifact is v3 and producer=coding_agent_baseline.
risk_level: network_llm_generated_data
network_policy: The harness is local; any model invocation by the adapter requires explicit authority.
generated_files_policy: Baseline run archives are immutable, local, and ignored.
referenced_paths:
- benchmark/AGENTS.md
- scripts/init_coding_agent_baseline.py
- scripts/run_coding_agent_baseline.py
- src/stella/benchmark/coding_agent_baseline.py
- skills/hvs-candidates-extraction/rules/profiles.yaml
- benchmark/SCORE_SPEC.md
