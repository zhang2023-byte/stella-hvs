id: ads_metadata_repair
human_intents:
- repair ADS metadata
- fix bibcodes
- refresh ADS API metadata
required_inputs:
- target
optional_inputs:
- force
- dry_run
clarify_if_missing:
- target
- ads_api_permission
agent_prompt_template: >-
  Run ads_metadata_repair for TARGET=<arXiv IDs or all archived papers>. Query the ADS API
  only, save full ads_metadata.json responses, update audit.json, and fill only paper.bibcode
  in literature_hvs_candidates.json if present. Do not construct bibcodes and do not scrape
  ADS HTML.
prerequisite_checks:
- Confirm target archived papers exist.
- Confirm ADS_API_TOKEN or ADS_TOKEN is available.
- Confirm permission for ADS API calls.
commands:
- conda run -n stella-env python scripts/repair_ads_metadata.py --arxiv-id <ids>
- conda run -n stella-env python scripts/repair_ads_metadata.py
outputs:
- literature/<arxiv_id>/ads_metadata.json
- literature/<arxiv_id>/audit.json
- literature/<arxiv_id>/literature_hvs_candidates.json
validators:
- Inspect command summary and audit.json ads_api/ads_metadata status.
risk_level: network_api
network_policy: Requires explicit permission for ADS API calls.
generated_files_policy: Do not edit candidate_origin.citation.bibcode for cited literature.
referenced_paths:
- scripts/repair_ads_metadata.py
- docs/data-contract.md
