id: catalog_review_batch
human_intents:
- batch review paper data assets
- review multiple paper data assets
- inspect catalog tables for multiple papers
- fill catalog_review for multiple papers
required_inputs:
- arxiv_ids
optional_inputs:
- max_parallel
- require_complete
clarify_if_missing:
- arxiv_ids
- continue_if_archive_assets_missing
agent_prompt_template: >-
  Run catalog_review_batch for ARXIV_IDS=<arxiv_ids>. The parent agent must dispatch one
  fresh subagent per arXiv ID using the catalog_review worker workflow. Do not process multiple
  papers in the parent context and do not reuse a worker for more than one paper. Use adaptive_probe
  concurrency: use any tool-exposed concurrency limit when available; otherwise gradually
  start workers until a concurrency, quota, or rate-limit error reveals the current cap.
  When a worker finishes, close or clear it before dispatching the next queued paper. Track
  completed, blocked, failed, and partial worker statuses, then rebuild the catalog workflow
  index once after all workers finish.
prerequisite_checks:
- Resolve the target arXiv ID list before dispatch.
- >-
  Confirm subagent capability is available; if unavailable, report the limitation instead
  of processing multiple papers in one context.
- Confirm archive-asset failure policy for the batch.
commands:
- Dispatch one fresh subagent per <arxiv_id> with the catalog_review workflow prompt.
- conda run -n stella-env python scripts/build_catalog_index.py
outputs:
- literature/<arxiv_id>/catalog_review.json
- literature/01_literature_catalog_index.json
- literature/01_literature_catalog_index.md
validators:
- >-
  conda run -n stella-env python scripts/validate_catalog_review.py --arxiv-id <arxiv_id>
  --require-complete
- Review all worker status records before rebuilding the catalog workflow index.
risk_level: generated_data
network_policy: No new external resource downloads in this workflow.
generated_files_policy: >-
  catalog_review.json is per-paper source data; generated indexes are rebuilt once by the
  parent after workers complete.
orchestration:
  unit: arxiv_id
  worker_workflow: catalog_review
  worker_reuse_policy: never
  concurrency_strategy: adaptive_probe
  parent_role: dispatch_monitor_summarize
  worker_status_fields:
  - arxiv_id
  - status
  - outputs
  - validator_result
  - warnings
  - blockers
  - next_action
  worker_status_values:
  - completed
  - blocked
  - failed
  - partial
referenced_paths:
- scripts/build_catalog_index.py
- skills/hvs-catalog-review/SKILL.md
- docs/data-contract.md
