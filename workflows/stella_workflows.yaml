version: 1
agent_bootstrap:
  first_read: AGENTS.md
  execution_contract: workflows/stella_workflows.yaml
  workflow_definitions: workflows/definitions/<workflow_id>.yaml
  rule: Agents route requests through this YAML index and load only the selected workflow definition.
clarification_policy: >-
  Ask only for missing details that change results, trigger real network/API calls, or risk
  modifying the wrong generated data. Use documented defaults for low-risk optional inputs
  and report assumptions.
temporary_artifacts_policy: >-
  Temporary helper scripts, scratch files, probes, and one-off analysis outputs created during
  workflow execution must be removed before the agent reports completion, unless explicitly
  kept by the user or promoted into maintained project code with appropriate tests and documentation.
  Prefer /tmp or ignored scratch locations for temporary files, and do not delete canonical
  project scripts under scripts/.
workflows:
- id: monthly_literature_fetch
  human_intents:
  - fetch HVS literature
  - update monthly papers
  - process recent HVS papers
  risk_level: network
  file: definitions/monthly_literature_fetch.yaml
- id: catalog_assessment
  human_intents:
  - assess data papers
  - find papers with observational catalogs
  - add catalog_assessment
  risk_level: network_llm
  file: definitions/catalog_assessment.yaml
- id: literature_asset_archive
  human_intents:
  - archive paper assets
  - download papers
  - pull literature assets
  risk_level: network_download
  file: definitions/literature_asset_archive.yaml
- id: ads_metadata_repair
  human_intents:
  - repair ADS metadata
  - fix bibcodes
  - refresh ADS API metadata
  risk_level: network_api
  file: definitions/ads_metadata_repair.yaml
- id: catalog_review
  human_intents:
  - review paper data assets
  - inspect catalog tables
  - fill catalog_review
  risk_level: generated_data
  file: definitions/catalog_review.yaml
  routing:
    unit: arxiv_id
    batch_variant: catalog_review_batch
    use_batch_when: more than one arxiv_id is requested
- id: catalog_review_batch
  human_intents:
  - batch review paper data assets
  - review multiple paper data assets
  - inspect catalog tables for multiple papers
  - fill catalog_review for multiple papers
  risk_level: generated_data
  file: definitions/catalog_review_batch.yaml
  routing:
    unit: arxiv_id
    worker_workflow: catalog_review
    worker_reuse_policy: never
    concurrency_strategy: adaptive_probe
- id: catalog_table_extraction
  human_intents:
  - extract reviewed tables
  - convert catalog tables
  - write ECSV
  risk_level: generated_data
  file: definitions/catalog_table_extraction.yaml
- id: hvs_candidate_extraction
  human_intents:
  - extract HVS candidates
  - check paper for unbound candidates
  - fill literature_hvs_candidates
  risk_level: scientific_judgment
  file: definitions/hvs_candidate_extraction.yaml
  routing:
    unit: arxiv_id
    batch_variant: hvs_candidate_extraction_batch
    use_batch_when: more than one arxiv_id is requested
- id: hvs_candidate_extraction_batch
  human_intents:
  - batch extract HVS candidates
  - extract HVS candidates for multiple papers
  - check multiple papers for unbound candidates
  - fill literature_hvs_candidates for multiple papers
  risk_level: scientific_judgment
  file: definitions/hvs_candidate_extraction_batch.yaml
  routing:
    unit: arxiv_id
    worker_workflow: hvs_candidate_extraction
    worker_reuse_policy: never
    concurrency_strategy: adaptive_probe
- id: object_catalog_merge
  human_intents:
  - merge HVS catalog
  - rebuild object catalog
  - update catalog
  risk_level: network_api_generated_data
  file: definitions/object_catalog_merge.yaml
- id: hvs_dynamics_calculate
  human_intents:
  - calculate HVS dynamics
  - recompute unbound probabilities
  - calculate total velocity and escape probability
  - run Bayes kinematics
  risk_level: generated_data
  file: definitions/hvs_dynamics_calculate.yaml
- id: hvs_catalog_web_build
  human_intents:
  - build HTML catalog
  - refresh website
  - build demo site
  risk_level: generated_view
  file: definitions/hvs_catalog_web_build.yaml
- id: hvs_catalog_pages_prepare
  human_intents:
  - prepare GitHub Pages site
  - publish HTML catalog
  - deploy website
  - prepare website deployment
  risk_level: generated_view_deployment_artifact
  file: definitions/hvs_catalog_pages_prepare.yaml
- id: benchmark_gold_annotation_form
  human_intents:
  - annotate benchmark gold
  - fill expert annotation form
  - serve gold annotation form
  - expert-led gold annotation
  - scribe my gold annotation
  - transcribe candidates into the gold draft
  - fill the annotation draft from the PDF
  - act as annotation scribe
  risk_level: human_gold_annotation
  file: definitions/benchmark_gold_annotation_form.yaml
- id: benchmark_campaign_prepare
  human_intents:
  - prepare benchmark campaign
  - rebuild hvs extraction campaign
  - freeze benchmark sample
  risk_level: generated_data
  file: definitions/benchmark_campaign_prepare.yaml
- id: benchmark_extraction_run
  human_intents:
  - run formal benchmark extraction
  - prepare benchmark method run
  - run hvs extraction campaign split
  risk_level: network_llm_generated_data
  file: definitions/benchmark_extraction_run.yaml
- id: benchmark_dev_console
  human_intents:
  - open benchmark dev console
  - debug benchmark extraction in a GUI
  - inspect live benchmark paper status
  - inspect paper-level benchmark run failures
  - review benchmark run history
  - configure multiple dev experiments
  - evaluate a dev experiment group
  - retry an external-service failure in an unsealed dev run
  risk_level: local_ui_network_llm
  file: definitions/benchmark_dev_console.yaml
- id: benchmark_run_finalize
  human_intents:
  - audit and seal benchmark run
  - finalize benchmark run
  - release benchmark test run
  risk_level: private_gold_metadata
  file: definitions/benchmark_run_finalize.yaml
- id: benchmark_score_report
  human_intents:
  - formally score benchmark run
  - build benchmark score report
  - compare formal benchmark runs
  risk_level: private_gold_scoring
  file: definitions/benchmark_score_report.yaml
- id: index_or_markdown_regeneration
  human_intents:
  - regenerate Markdown
  - refresh generated views
  - rebuild indexes
  risk_level: generated_view
  file: definitions/index_or_markdown_regeneration.yaml
