version: 2
# The only public product workflows. Agents discover them through
# `python -m stella workflow list|show|plan|run`; procedures live in the
# owner operations referenced here, never as copied Agent instructions.
workflows:
- id: literature_pipeline
  human_intents:
  - fetch HVS literature and archive paper assets
  - review paper data assets and extract catalog tables
  - extract HVS contributions and rebuild contribution indexes
  - build object timelines and the contribution website
  input_model: stella.workflows:LiteraturePipelineRequest
  output_model: stella.workflows:WorkflowRunSummary
  default_behavior: plan
  failure_policy: partial
  authority_gates:
    network: literature discovery, asset download, and metadata repair call real endpoints
    llm: catalog assessment/review and contribution extraction call provider models
    supersede: replacing an existing canonical contribution artifact
  phases:
  - id: discover_fetch
    operations:
    - literature.fetch
  - id: archive
    operations:
    - literature.archive_assets
  - id: catalog
    operations:
    - literature.assess_catalog
    - literature.review_catalog
    - literature.extract_catalog
  - id: contributions
    operations:
    - literature.extract_contributions
  - id: indexes
    operations:
    - literature.build_contribution_index
    - literature.build_object_timelines
  - id: dynamics
    operations:
    - dynamics.validate_input_selection
    - dynamics.calculate
    optional: true
    gate: requires an explicit human-approved dynamics input-selection snapshot
  - id: site
    operations:
    - web.build_contribution_site
    optional: true
    gate: writes the contribution site into the configured output directory
- id: gold_annotation
  human_intents:
  - annotate contribution gold
  - open the contribution-only expert PDF form
  - validate and save expert annotations
  - list an expert's annotation queue
  - prepare the public value-free gold selection
  input_model: stella.workflows:GoldAnnotationRequest
  output_model: stella.workflows:WorkflowRunSummary
  default_behavior: plan
  failure_policy: complete
  authority_gates:
    gold_private: reading and writing the external private gold store
  phases:
  - id: queue
    operations:
    - gold.list_queue
  - id: annotate
    operations:
    - gold.open_annotation
  - id: validate
    operations:
    - gold.validate_annotation
  - id: save
    operations:
    - gold.save_annotation
    gate: writes one annotation JSON per paper and expert into the private store
  - id: selection
    operations:
    - gold.prepare_selection
    optional: true
    gate: publishes a value-free gold selection profile
- id: benchmark
  human_intents:
  - run the benchmark
  - prepare a benchmark campaign and freeze the method
  - resume or finalize a benchmark run
  - score a benchmark run and emit the aggregate scorecard
  input_model: stella.workflows:BenchmarkRequest
  output_model: stella.workflows:WorkflowRunSummary
  default_behavior: plan
  failure_policy: partial
  authority_gates:
    network: provider gateway access for extraction runs
    llm: extraction calls provider models
    gold_private: scoring reads the external private gold store
    scoring: formal scoring writes private details and the public scorecard
  phases:
  - id: prepare
    operations:
    - benchmark.prepare_campaign
  - id: freeze
    operations:
    - benchmark.freeze_method
  - id: run
    operations:
    - benchmark.execute
  - id: resume
    operations:
    - benchmark.resume
    optional: true
    gate: resumes only unfinished or network-failed papers of an active run
  - id: finalize
    operations:
    - benchmark.finalize
    gate: finalize is one-way and makes the run immutable
  - id: score
    operations:
    - benchmark.score
    - benchmark.emit_scorecard
    optional: true
    gate: formal scoring requires the frozen gold selection profile
