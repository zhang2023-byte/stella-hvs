# Contribution-first expert gold annotation — blank template (PRE-ACTIVATION)
#
# This template belongs to the contribution-first annotation contract. Formal
# annotation is DISABLED until the expert session approves the contribution
# guideline wording and a benchmark campaign is bound to it. Copying this
# file into a private gold directory and running the upgrade script before
# that activation is not a formal gold act.
#
# Experts annotate from the paper PDF only (the PDF is the normative evidence
# source); do not consult extracted JSON, TeX, ECSV files, or archived AI runs.

schema:
  name: benchmark.hvs_contribution_annotation
  version: 1
arxiv_id: ""              # must match the directory name
annotator: ""             # your short handle, stable across the project
annotated_at: ""          # date you finished this paper
guideline_version: ""     # version of the approved contribution guideline
evidence_basis: pdf
status: contributions_found  # or: no_contributions (then leave contributions empty)

contributions:
  - paper_candidate_id: "" # paper's main display id; empty if only Gaia id
    gaia_source_id: ""    # strict form "Gaia DR3 123..."; "" if none
    aliases: []           # other paper-visible identifiers only
    contribution_type: "" # REQUIRED: candidates_found | follow_up
    contribution_note: "" # REQUIRED: what this paper actually did to this
                          # object, including unstructured results; for
                          # not_assessed state that no new boundness
                          # conclusion was reported
    contribution_evidence:            # REQUIRED, at least one PDF locator
      - location: ""      # e.g. "Sec 4.2, second paragraph"
        quote: ""         # optional short verbatim quote
    paper_boundness:
      status: ""          # REQUIRED: unbound | possibly_unbound | bound |
                           # no_overall_conclusion | not_assessed
      evidence:            # at least one locator unless status is not_assessed
        - location: ""
          quote: ""
    measurements:          # grouped multivalue; omit for no structured values
      - field: ""          # one of the 19 structured fields, e.g.
                            # observed_phase_space.distance
        values:
          - value: ""      # number as printed; empty only for limit_kind range
            error: ""
            lower_error: ""
            upper_error: ""
            unit: ""
            limit_kind: none  # none | lower_limit | upper_limit | range
            range_lower: ""  # only for limit_kind: range
            range_upper: ""
            coordinate_format: ""  # ra/dec only: decimal_degrees |
                                   # sexagesimal_hms | sexagesimal_dms |
                                   # sexagesimal_colon
            condition_note: ""  # potential/prior/method/epoch/data release
            paper_preferred: null  # true | false | null (explicit only)
            source:
              kind: this_paper  # this_paper | prior_work | unclear
              paper_visible_citation: ""  # rendered citation, "" if none
              bibkey: ""              # only when reliably recoverable
              citation_evidence:
                - location: ""
                  quote: ""
            evidence:        # direct PDF evidence for this value
              - location: ""
                quote: ""
            context_evidence: []
            notes: ""
    notes: ""

reviewed_exclusions:       # audit material for expert transparency
  - note: ""               # why this exclusion is scientifically relevant
    evidence:
      - location: ""
        quote: ""

notes: ""
