# Expert gold annotation — filled example (fictional paper, realistic shape)
#
# Shows one candidates_found annotation with: a candidate carrying a Gaia id,
# coordinate/motion quantities, an exact quantity, a lower limit, and a range.
# Values are illustrative, not from a real paper.

schema_version: stella.benchmark_gold_annotation.v0.1
arxiv_id: "9901.00001"
annotator: will
annotated_at: "2026-06-15"
guideline_version: "0000000"  # quote git hashes: all-digit ones parse as numbers
evidence_basis: pdf
status: candidates_found

candidates:
  - paper_candidate_id: J1234+5678
    gaia_source_id: "Gaia DR3 1234567890123456789"
    aliases:
      - LAMOST J1234+5678
    origin_type: introduced_by_this_paper
    quantities:
      - field: observed_phase_space.ra
        value: "12:34:02.88"
        unit: hms
        evidence:
          - location: "Table 1, row J1234+5678, col RA"
      - field: observed_phase_space.dec
        value: "+56:46:51.6"
        unit: dms
        evidence:
          - location: "Table 1, row J1234+5678, col Dec"
      - field: observed_phase_space.proper_motion_ra
        value: "-2.41"
        unit: mas/yr
        evidence:
          - location: "Table 1, row J1234+5678, col pmRA"
      - field: observed_phase_space.proper_motion_dec
        value: "1.05"
        unit: mas/yr
        evidence:
          - location: "Table 1, row J1234+5678, col pmDec"
      - field: observed_phase_space.radial_velocity
        value: "612.3"
        error: "4.1"
        unit: km/s
        evidence:
          - location: "Table 1, row J1234+5678, col RV"
      - field: derived_kinematics.galactic_rest_frame_velocity
        value: "743"
        lower_error: "12"
        upper_error: "15"
        unit: km/s
        evidence:
          - location: "Table 3, row J1234+5678, col v_GC"
            quote: "743^{+15}_{-12}"
      - field: bound_assessment.escape_velocity
        value: "580"
        unit: km/s
        limit_kind: lower_limit
        evidence:
          - location: "Sec 4.1, first paragraph"
            quote: "the local escape speed exceeds 580 km/s"
      - field: observed_phase_space.distance
        unit: kpc
        limit_kind: range
        range_lower: "8.2"
        range_upper: "11.6"
        evidence:
          - location: "Sec 3.2"
            quote: "heliocentric distances between 8.2 and 11.6 kpc"
    evidence:
      - location: "Sec 4.2, second paragraph"
        quote: "we therefore consider J1234+5678 a hypervelocity candidate"
    notes: ""

notes: ""
