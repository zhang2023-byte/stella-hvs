notes: 'PDF-only expert annotation draft. The paper reports a final sample of 23 HiVel
  stars from APOGEE DR17 radial velocities, Gaia eDR3 positions/proper motions, and
  Bailer-Jones et al. (2021) photogeometric distances; the three candidates are the
  last rows of Tables 1 and 2. Sec. 3 states that the transformation used Astropy
  v4.0 default Galactocentric-frame parameters: Sun-Galactic-center distance 8.122
  kpc, Sun-Galactic-midplane distance 20.8 pc, and Solar Cartesian velocity (12.9,
  245.6, 7.78) km s^-1. Sec. 3.1 defines p_ub = n(v_GC > v_esc)/1000 for 1000 MC realizations
  and compares Irrgang Model I, McMillan17, and MWPotential2014 potentials, but the
  PDF does not report per-star p_ub or escape-velocity numbers. The text and conclusions
  say the three stars are unbounded to MWPotential2014 but bounded to Irrgang Model
  I; the MWPotential2014 excess is within 1 sigma velocity uncertainties. Orbit integrations
  use Irrgang Model I and Table 3 gives negative nominal orbital energies for the
  three candidates. The paper does not claim a confirmed HVS: it describes the stars
  as borderline, distance-sensitive, and more bound when the LMC is included. Kinematically,
  it says all stars are typical halo stars; chemically, most are compatible with low-alpha
  halo/accreted stars. The main exception among these three candidates is 2M15180013+0209292,
  which Sec. 7/conclusions flag as unusually enriched in Al/N and Al/Ni/O.'
